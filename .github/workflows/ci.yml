name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gpo-assistent/frontend/package-lock.json
      - name: Install dependencies
        working-directory: gpo-assistent/frontend
        run: npm ci
      - name: Type check & Build
        working-directory: gpo-assistent/frontend
        run: |
          npm run build

  backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: gpo-assistent/backend/requirements.txt
      - name: Install dependencies
        working-directory: gpo-assistent/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Vector & Unit Tests
        working-directory: gpo-assistent/backend
        run: |
          pytest -q tests_vector/
